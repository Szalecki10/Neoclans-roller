# Render Blueprint: New + > Blueprint > wybierz to repo. Szczegóły w README.md.
services:
  - type: web
    name: neoclans-roller
    runtime: python
    plan: free
    region: frankfurt # baza na Neonie też we Frankfurcie (AWS eu-central-1)
    buildCommand: pip install -r requirements.txt
    # Jeden proces, żeby pamięć podręczna tabeli genów była spójna; wątki wystarczą dla kilku osób.
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 60
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Hasło admina jest w app.py jako hash – tu tylko baza.
      - key: DATABASE_URL
        sync: false # connection string z Neon (postgresql://...)
